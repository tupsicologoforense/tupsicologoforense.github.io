<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis Frases y Videos</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header>
    <h1>Mis Frases y Videos</h1>
    <nav>
      <button class="tab activa" data-seccion="frases">Frases</button>
      <button class="tab" data-seccion="videos">Videos</button>
    </nav>
  </header>

  <main>
    <section id="frases" class="seccion activa"></section>
    <section id="videos" class="seccion"></section>
  </main>

  <footer>Hecho con ❤️</footer>

  <script src="contenido.js"></script>
  <script>
    const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    document.getElementById('frases').innerHTML = FRASES.length
      ? FRASES.map(f => `
          <blockquote class="tarjeta">
            <p>“${esc(f.texto)}”</p>
            ${f.fecha ? `<time>${esc(f.fecha)}</time>` : ''}
          </blockquote>`).join('')
      : '<p class="vacio">Aún no hay frases.</p>';

    document.getElementById('videos').innerHTML = VIDEOS.length
      ? VIDEOS.map(v => `
          <article class="tarjeta video">
            ${v.youtube
              ? `<iframe src="https://www.youtube-nocookie.com/embed/${esc(v.youtube)}" title="${esc(v.titulo)}" allowfullscreen loading="lazy"></iframe>`
              : `<video src="${esc(v.archivo)}" controls preload="metadata"></video>`}
            <h3>${esc(v.titulo)}</h3>
          </article>`).join('')
      : '<p class="vacio">Aún no hay videos.</p>';

    document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
      document.querySelectorAll('.tab, .seccion').forEach(e => e.classList.remove('activa'));
      b.classList.add('activa');
      document.getElementById(b.dataset.seccion).classList.add('activa');
    });
  </script>
</body>
</html>
